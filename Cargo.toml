[package]
name = "c2n"
version = "0.1.0"
edition = "2024"
description = "Download ChatGPT image generations, embed prompts in PNG metadata, and archive them in Notion"
license = "MIT"
repository = "https://github.com/labasubagia/c2n"
[dependencies]
anyhow = "1"
async-trait = "0.1"
backon = { version = "1.6", features = ["tokio-sleep"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8"
directories = "6"
email_address = "0.2"
futures-util = "0.3"
iana-time-zone = "0.1"
img-parts = "0.4"
indicatif = "0.18"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream", "charset", "query"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
